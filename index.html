<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Happy Birthday, Lala 🌷</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/assets/images/moment4.jpeg">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-pink-50 text-pink-900 font-poppins">

  <nav class="fixed top-0 left-0 right-0 z-50 bg-white/60 backdrop-blur py-3 shadow-sm">
    <div class="max-w-5xl mx-auto flex items-center justify-between px-4">
      <div class="flex items-center gap-3">
        <img src="assets/images/tulip.png" alt="logo" class="w-10 h-10 rounded-full object-cover shadow-sm">
        <div>
          <div class="font-dancing text-2xl text-pink-600">For Lala</div>
          <div class="text-xs text-pink-500">Happy Birthday 🌷</div>
        </div>
      </div>

      <ul class="flex gap-3 items-center text-sm">
        <li><a href="#" data-page="intro" class="nav-link px-3 py-1 rounded-md bg-pink-200 text-pink-700">Start</a></li>
        <li><a href="#" data-page="home" class="nav-link px-3 py-1 rounded-md hover:bg-pink-100">Home</a></li>
        <li><a href="#" data-page="about" class="nav-link px-3 py-1 rounded-md hover:bg-pink-100">About Lala</a></li>
        <li><a href="#" data-page="memories" class="nav-link px-3 py-1 rounded-md hover:bg-pink-100">Memories</a></li>
        <li><a href="#" data-page="video" class="nav-link px-3 py-1 rounded-md hover:bg-pink-100">Video</a></li>
        <li><a href="#" data-page="playlist" class="nav-link px-3 py-1 rounded-md hover:bg-pink-100">Playlist</a></li>
        <li><a href="#" data-page="cake" class="nav-link px-3 py-1 rounded-md hover:bg-pink-100">Cake 🎂</a></li>
        <li><a href="#" data-page="note" class="nav-link px-3 py-1 rounded-md hover:bg-pink-100">Special Note ✨</a></li>
      </ul>
    </div>
  </nav>

  <div id="petal-container" class="pointer-events-none fixed inset-0 z-40"></div>

  <main class="pt-28 max-w-5xl mx-auto px-4 pb-24">
    <section id="intro" class="min-h-[70vh] flex flex-col items-center justify-center text-center">
      <h1 id="introTitle" class="text-5xl md:text-6xl font-dancing text-pink-600 mb-4 glow-text">Hi Lala 🌷</h1>
      <p id="intro-typed" class="max-w-2xl text-pink-700 text-lg mb-6"></p>
      <div class="flex gap-4">
        <button id="startBtn" class="bg-pink-500 text-white px-6 py-3 rounded-full shadow-lg hover:scale-105 transition">Start the surprise 💕</button>
        <button id="skipIntro" class="bg-white/90 text-pink-600 px-4 py-2 rounded-full shadow hover:scale-105 transition">Skip</button>
      </div>
    </section>

    <div id="content"></div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
